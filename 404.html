<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#090909" />
  <title>404 — OneOne</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root{--bg:#090909;--text:#f4f2ed;--muted:#9d9b95;--line:#2c2c2c;--accent:#d9ff3f}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 44%,#12150f 0,#090909 35%,#070707 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:28px;overflow:hidden}
    .wrap{width:min(920px,100%);text-align:center;position:relative;z-index:1}.orbit{width:min(330px,78vw);aspect-ratio:1;margin:0 auto 36px;position:relative;display:grid;place-items:center}.ring{position:absolute;border:1px solid #343434;border-radius:50%;inset:0}.ring.small{inset:20%;border-style:dashed;opacity:.8}.dot{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--accent);left:20%;bottom:11%;box-shadow:0 0 20px rgba(217,255,63,.45)}.code{font:800 31px/1.02 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.09em;text-align:center}.glow{position:absolute;width:120px;height:120px;border-radius:50%;background:var(--accent);filter:blur(42px);opacity:.12}
    .kicker{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--muted);margin:0 0 14px}.num{font-size:clamp(82px,15vw,150px);line-height:.78;letter-spacing:-.08em;margin:0;font-weight:900}.text{font-size:clamp(20px,4vw,34px);font-weight:800;margin:30px 0 10px}.sub{color:var(--muted);margin:0 auto 28px;max-width:560px}.btn{display:inline-flex;min-height:50px;align-items:center;justify-content:center;padding:0 22px;border-radius:999px;background:var(--accent);color:#090909;font-weight:800;text-decoration:none;transition:transform .2s ease}.btn:hover{transform:translateY(-2px)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="orbit" aria-hidden="true"><div class="ring"></div><div class="ring small"></div><div class="glow"></div><div class="dot"></div><div class="code">01<br>ONE<br>ONE</div></div>
    <p class="kicker">ONEONE / 404</p>
    <h1 class="num">404</h1>
    <p class="text">Сторінку не знайдено.</p>
    <p class="sub">Посилання могло змінитися або сторінки більше не існує. Повернись до портфоліо.</p>
    <a class="btn" href="/">На головну</a>
  </main>
</body>
</html>
