name: BarberPoint uptime check

on:
  schedule:
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check production API and Supabase
        env:
          API: https://barberpoint-api-oneone.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 10 "$API/api/health" > health.json
          cat health.json
          python - <<'PY'
          import json
          data=json.load(open("health.json"))
          assert data["ok"] is True, data
          assert data["database"] == "postgresql", data
          assert data["provider"] == "supabase", data
          assert data["services"] >= 4, data
          assert data["barbers"] >= 3, data
          PY
