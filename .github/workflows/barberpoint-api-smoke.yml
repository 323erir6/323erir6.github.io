name: BarberPoint API smoke test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        run: sleep 90

      - name: Verify PostgreSQL-backed health endpoint
        env:
          API: https://barberpoint-api-oneone.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 10 "$API/api/health" > health.json
          cat health.json
          python - <<'PY'
          import json
          data=json.load(open("health.json"))
          assert data["ok"] is True, data
          assert data["database"] == "postgresql", data
          assert data["services"] == 4, data
          assert data["barbers"] == 3, data
          PY

      - name: Verify public catalog and availability
        env:
          API: https://barberpoint-api-oneone.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$API/api/services" > services.json
          curl --fail --silent --show-error "$API/api/barbers" > barbers.json

          read SERVICE_ID BARBER_ID < <(python - <<'PY'
          import json
          services=json.load(open("services.json"))
          barbers=json.load(open("barbers.json"))
          assert len(services) == 4, services
          assert len(barbers) == 3, barbers
          assert all("id" in x and "code" in x for x in services)
          assert all("id" in x and "code" in x for x in barbers)
          print(services[0]["id"], barbers[0]["id"])
          PY
          )

          DAY="$(date -u -d '+7 days' +%F)"
          curl --fail --silent --show-error             "$API/api/available-slots?barber_id=$BARBER_ID&service_id=$SERVICE_ID&date=$DAY"             > slots.json

          python - <<'PY'
          import json, re
          data=json.load(open("slots.json"))
          assert data["slots"], data
          assert all(re.fullmatch(r"\d{2}:\d{2}", slot) for slot in data["slots"]), data
          PY

          STATUS="$(curl --silent --show-error -o invalid-booking.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d "{\"name\":\"Smoke Test\",\"phone\":\"+380000000000\",\"service_id\":$SERVICE_ID,\"barber_id\":$BARBER_ID,\"date\":\"$DAY\",\"time\":\"03:17\"}"             "$API/api/bookings")"
          test "$STATUS" = "409"
          cat invalid-booking.json

      - name: Verify admin protection
        env:
          API: https://barberpoint-api-oneone.onrender.com
        run: |
          set -euo pipefail
          STATUS="$(curl --silent --show-error -o admin.json -w '%{http_code}' "$API/api/admin/bookings")"
          test "$STATUS" = "401"

      - name: Verify GitHub Pages CORS
        env:
          API: https://barberpoint-api-oneone.onrender.com
        run: |
          set -euo pipefail
          headers="$(curl --fail --silent --show-error -D - -o /dev/null             -H 'Origin: https://323erir6.github.io'             "$API/api/services")"
          echo "$headers"
          echo "$headers" | grep -qi 'Access-Control-Allow-Origin: https://323erir6.github.io'
